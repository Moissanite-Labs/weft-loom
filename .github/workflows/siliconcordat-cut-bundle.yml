name: siliconcordat-cut-bundle

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  siliconcordat-cut-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Moissanite-Labs/weft
          path: weft-src
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Test siliconcordat cut bundle build contract
        env:
          WEFT_REPO: weft-src
        run: python3 -m unittest discover -s scripts -p test_build_siliconcordat_cut_bundle.py
      - name: Weft pin checks fail on a missing or off-history pin
        run: python3 -m unittest discover -s scripts -p test_cut_weft_pin.py
      - name: Build ml-siliconcordat-cut dist-cut/ (staging preview)
        env:
          SILICONCORDAT_CUT_HOST: staging
          WEFT_REPO: weft-src
        run: python3 scripts/build_siliconcordat_cut_bundle.py
      - name: Verify dist-cut MANIFEST.sha256
        run: cd dist-cut && sha256sum -c MANIFEST.sha256
      - name: Verify ml-siliconcordat-cut bundle (staging)
        env:
          SILICONCORDAT_CUT_HOST: staging
        run: python3 scripts/verify_siliconcordat_cut_bundle.py
      - name: Verify ml-siliconcordat-cut production build omits noindex
        env:
          SILICONCORDAT_CUT_HOST: production
          WEFT_REPO: weft-src
        run: |
          python3 scripts/build_siliconcordat_cut_bundle.py
          python3 scripts/verify_siliconcordat_cut_bundle.py
      - name: ml-siliconcordat-cut redirect rules
        run: node --test workers/test_siliconcordat-cut.mjs
