<script>
const D=[{"t": "LAWS OF THE CELL", "s": "What a cell feels: energy, price, need", "d": "Known: cells stop at the first passing answer, always pick the cheapest model, never divide (0 of 12+). Colony shape is not the lever (SP2).", "k": "branch"}, {"t": "Need sensor (SP3)", "s": "in build now \u00b7 my pick", "d": "One inward number: my body's score against the best my lineage ever recorded. Patch written tonight, not yet run. Tests K20: cells stop without knowing what is possible.", "k": "now"}, {"t": "Escalation after a failed try", "s": "ready to run, tooling exists \u00b7 my pick", "d": "A failed round on one model does not count as 'no headroom' until one round on the next model up has also failed. Won in the toy network (GR4, lowest worst-case regret). Never tried in cells.", "k": "ready"}, {"t": "Exchange rate: thought price vs win reward", "s": "ready to run, tooling exists \u00b7 my pick", "d": "A mid step costs 50 to 100, a +10% win pays 38, so cheap and early is rational (K18). Move the rate and see if reach moves. Possibly the real lever.", "k": "ready"}, {"t": "Rest is not free (upkeep)", "s": "ready to run, tooling exists", "d": "I2a. A resting body keeps paying a small living cost. Today rest is free and safe, which may cost reach (K16).", "k": "ready"}, {"t": "Red Queen kit", "s": "ready to run, tooling exists", "d": "I2c. The kit gets harder as the colony's best rises, so a body that stands still loses ground.", "k": "ready"}, {"t": "Inheritance by fitness", "s": "ready to run, tooling exists", "d": "I2b. Surplus energy flows in proportion to scored gain, not equally.", "k": "ready"}, {"t": "Reproduction as the only store", "s": "ready to run, tooling exists", "d": "I2d. Energy above a level cannot be held, only spent on a daughter. Gives division a cause.", "k": "ready"}, {"t": "Daughters born different", "s": "ready to run, tooling exists", "d": "K1/K3. A copy gives the gate nothing to judge (seen in networks and cells). Daughter starts with another model, effort, or slice of the need.", "k": "ready"}, {"t": "Machine load as price", "s": "needs new tooling first", "d": "K4. Energy cost per step follows real CPU and memory load, so cells feel the machine through the law, not a prompt line. Your sensor-exposure idea.", "k": "build"}, {"t": "WHICH MIND", "s": "Model families and mixtures", "d": "Known: the effect of the variants tool flips with the model (F5). hy4 never attempted improvement. Only Sonnet/Haiku have run on the valid instrument.", "k": "branch"}, {"t": "Same laws, second family", "s": "ready to run, tooling exists \u00b7 my pick", "d": "I2e. Run the energy laws on Mistral Large 4 and Argon. No finding counts until it holds on two families (flag rule).", "k": "ready"}, {"t": "Mixed colony: strong builds, cheap runs", "s": "ready to run, tooling exists", "d": "Strong model for tool-building steps, cheap for routine. Metric: tokens per improvement, against all-cheap and all-strong.", "k": "ready"}, {"t": "hy4 with the hold rule", "s": "ready to run, tooling exists", "d": "F7. hy4 scored 0 because it never tried, not because it could not. Does a hold lift it?", "k": "ready"}, {"t": "Ask vs rule, same model", "s": "ready to run, tooling exists", "d": "F3. A nudge did nothing (Argon), a refusal did a lot (Sonnet). Never compared on one model and one kit set.", "k": "ready"}, {"t": "Model fingerprints in vector space", "s": "ready to run, tooling exists", "d": "E5. Do different models' code variants occupy separate regions? Does a mixed colony cover more area?", "k": "ready"}, {"t": "Argon reruns on the Gemini key", "s": "needs new tooling first", "d": "Cells are not yet wired to the Gemini route. Small wiring job, then the held Argon runs.", "k": "build"}, {"t": "WHAT IS INHERITED", "s": "Memory, reflexes, lessons from losers", "d": "Known: one error type recurred 15 times in the same cell. The prose library is read but changes little. Losers' code is archived and unused.", "k": "branch"}, {"t": "Dormant reflexes", "s": "ready to run, tooling exists \u00b7 my pick", "d": "T-J2, your discussion 105 idea. A cell that recovers from an error leaves a trigger and response. Costs nothing until the trigger recurs. Colony inherits it.", "k": "ready"}, {"t": "Nearest lessons only", "s": "ready to run, tooling exists", "d": "E4. Give each cell the top few library entries closest to its current code, not the whole file. None / all / top-k.", "k": "ready"}, {"t": "Losers passed on as vectors", "s": "needs new tooling first", "d": "H2b. The direction from losers to winners steers the next attempt (F1 steering, F2 toward/away test).", "k": "build"}, {"t": "Tool commons", "s": "needs new tooling first", "d": "R5/A1. Cells publish tools to a shared shelf. Watch which spread (cultural evolution).", "k": "build"}, {"t": "Seeded library", "s": "ready to run, tooling exists", "d": "Start a colony with the library of an earlier one. Is progress sequential across colonies or reset each time?", "k": "ready"}, {"t": "Structured genomes", "s": "needs new tooling first", "d": "Corpus idea (s-expression genomes): memory as structure the harness can cut and recombine, not prose.", "k": "build"}, {"t": "BEYOND TEXT", "s": "Fitness and signals that are not words", "d": "Known: a text-parsed score was once fooled by a warning line (179.0). Bend interaction counts are exactly repeatable on a pinned runtime.", "k": "branch"}, {"t": "Deterministic fitness (Bend/HVM)", "s": "ready to run, tooling exists \u00b7 my pick", "d": "G1/H2a. Score by interaction count, not wall time. Removes noise gate, repeats and bench lock. First question: can models write valid Bend at all?", "k": "ready"}, {"t": "An evaluator as the need", "s": "needs new tooling first", "d": "G3. The task is a lambda-calculus evaluator, which could later run the next generation. Gains could compound.", "k": "build"}, {"t": "Lean arm vs Bend arm", "s": "needs new tooling first", "d": "G5. Same task, same kit, one colony writing Lean, one Bend.", "k": "build"}, {"t": "Predict before benching", "s": "ready to run, tooling exists", "d": "E3. Nearest-neighbour guess of a variant's score from past variants. Skips likely losers, cuts the serial bench.", "k": "ready"}, {"t": "How wide should a split be", "s": "ready to run, tooling exists", "d": "E1/E2. Distance between daughters against gain. A novelty floor so every A/B is a real experiment.", "k": "ready"}, {"t": "One basin or many", "s": "ready to run, tooling exists", "d": "E6. Across colonies, do winners for a need collapse to one point or several?", "k": "ready"}, {"t": "PROOF", "s": "Selection as mathematics", "d": "Known: Lean 4 and Bend are installed. Nothing proven yet. Lean cannot verify Bend code in our stack, only Lean code or a log.", "k": "branch"}, {"t": "Needs that are theorems", "s": "ready to run, tooling exists \u00b7 my pick", "d": "R2. Fitness is 'the proof compiles'. No timing noise, no fake wins. First need: the Weft gate invariant (Paper 1, Prop 3).", "k": "ready"}, {"t": "Selection rule as a theorem", "s": "needs new tooling first", "d": "R3/F3. State the keep rule in Lean, prove fitness never falls across generations, generate the check from it.", "k": "build"}, {"t": "Proof-carrying wins", "s": "needs new tooling first", "d": "R1. A win is kept only with a certificate: differential test first, Lean equivalence proof later.", "k": "build"}, {"t": "Anchor to generation zero", "s": "ready to run, tooling exists", "d": "W2. Every winner must still match the first body's outputs. Measures silent drift (Weft's compounding-bound point).", "k": "ready"}, {"t": "Hash-chained lineage", "s": "ready to run, tooling exists", "d": "W3. Each cell's history as a replayable committed record, like Weft Paper 2.", "k": "ready"}, {"t": "GROWING A MODEL", "s": "The same laws one layer down", "d": "Known (toy networks): blind division plus a gate plus gradients sizes a network to its need. A fixed gate cannot tell satisfied from stuck. Tinker works end to end (5 of 5).", "k": "branch"}, {"t": "Adapter genome on Inkling 2 Small", "s": "ready to run, tooling exists \u00b7 my pick", "d": "T-J3. Cell experience becomes training data for a small adapter. Fork, train two ways, gate keeps the better. Key works, pilot not designed.", "k": "ready"}, {"t": "Sensor proposes, escalation confirms", "s": "ready to run, tooling exists", "d": "GR5. The combined gate law on the toy network. Only if the cell pilots need it.", "k": "ready"}, {"t": "When need is far out of reach", "s": "ready to run, tooling exists", "d": "K9. On the hardest toy task no gate wins and ungated growth does. Restraint costs most where need is highest. Open.", "k": "ready"}, {"t": "Weight genomes on local models", "s": "needs new tooling first", "d": "H2c. Small local model, genome is a weight delta, a split branches the delta. Direct bridge to Weft Paper 1.", "k": "build"}, {"t": "Do both layers obey the same laws", "s": "needs new tooling first", "d": "H2d/J1. Compare acceptance rate, bold-win share and gate binding between weights and code on matched budgets. Your central hypothesis.", "k": "build"}, {"t": "Model reshapes its own chip", "s": "out of reach today", "d": "The FPGA-like layer from the Weft roadmap. No such hardware here.", "k": "far"}, {"t": "COLONY AS ORGANISM", "s": "Structure, agency, scale", "d": "Known: doubling cells halved wins per 100 calls. A stem that feeds parts costs 1.6x tokens and ends level. Width needs a problem that splits with cheap checks.", "k": "branch"}, {"t": "A problem that truly splits", "s": "needs new tooling first \u00b7 my pick", "d": "J2/J7. Width only pays on needs with many unlike parts, each cheaply checkable. We have not yet built such a need. Without it 'swarm vs one agent' is untestable.", "k": "build"}, {"t": "Cells that rewrite the mitosis", "s": "needs new tooling first", "d": "A2/R4. A cell whose body is the runtime itself, scored by the wins of a small child colony. Bench and sandbox stay outside.", "k": "build"}, {"t": "Adversary cells", "s": "needs new tooling first", "d": "R6. One writes code, a sibling writes inputs that break it. The kit grows from the attacker's finds.", "k": "build"}, {"t": "Swarm vs one strong agent", "s": "needs new tooling first", "d": "T-J1 remainder. Colony against a single strong agent at equal tokens.", "k": "build"}, {"t": "Micro-harness swarms, many data types", "s": "needs new tooling first", "d": "J3. Modular harnesses spawning swarms across model families. Needs the splitting need first.", "k": "build"}, {"t": "Stem cell feeding", "s": "tested or paused, set aside", "d": "SP1/SP2. Need-directed feeding emerged without a rule, but ended nowhere better at higher cost. Parked, code kept.", "k": "parked"}, {"t": "Mortal law (no rest)", "s": "tested or paused, set aside", "d": "mp3. More attempts, but half the energy went on idling at end of life. Biology keeps rest and adds a wake signal.", "k": "parked"}, {"t": "INSTRUMENT", "s": "Things that keep results honest", "d": "Known: three instrument faults found and fixed so far (stderr score, cell-owned inputs, own-baseline gain).", "k": "branch"}, {"t": "Kits with real headroom", "s": "ready to run, tooling exists \u00b7 my pick", "d": "compress has no headroom and fibmod carries most effects. Results lean on 4 uneven tasks. More kits, each with a known ceiling.", "k": "ready"}, {"t": "Benchmark carryover", "s": "ready to run, tooling exists", "d": "G6. Does one cell's bench leave the machine hot for the next? Unchecked.", "k": "ready"}, {"t": "Do cells drift their own test", "s": "ready to run, tooling exists", "d": "F1. Count post-assay benchmark edits per model on the old cell-owned protocol. A finding about agents, not just a bug.", "k": "ready"}, {"t": "E07 record corrections", "s": "tested or paused, set aside", "d": "Weft PR 101. Paused at your word. Numbers already recomputed.", "k": "parked"}, {"t": "RAZI CELLS", "s": "open directions, 2026-11-10", "k": "branch", "
